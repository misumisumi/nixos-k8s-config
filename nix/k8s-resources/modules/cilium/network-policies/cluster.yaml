apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: allow-ssh
spec:
  nodeSelector:
    matchLabels:
      node-access: ssh
  ingress:
    - fromEntities:
        - cluster
    - toPorts:
        - ports:
            - port: "22"
              protocol: TCP
            - port: "6443"
              protocol: TCP
            - port: "443"
              protocol: TCP
            - port: "4240"
              protocol: TCP
            - port: "8472"
              protocol: UDP
            - protocol: VRRP
            # # tunneling
            # - protocol: GRE
            # - protocol: IPIP
            # - protocol: IPV6
            # # IPsec protocols
            # - protocol: ESP
            # - protocol: AH
    - icmps:
        - fields:
            - type: EchoRequest
              family: IPv4
